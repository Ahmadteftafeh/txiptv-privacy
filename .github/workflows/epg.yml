name: Refresh test EPG
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["gen_epg.py", ".github/workflows/epg.yml"]
permissions:
  contents: write
jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 gen_epg.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-epg.xml
          git diff --cached --quiet || (git commit -m "Refresh test EPG" && git push)
